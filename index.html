<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <meta name="robots" content="index,follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070507;
      --card: #14080c;
      --ink: #ffe4ec;
      --mute: #b08996;
      --pink: #ff2d6a;
      --pink2: #ff6b9d;
      --line: #3a1524;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Manrope, sans-serif;
      background: #070507;
      color: var(--ink);
    }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 22px 14px 40px; }
    .brand {
      text-align: center;
      color: var(--pink2);
      letter-spacing: .28em;
      font-size: 11px;
      text-transform: uppercase;
      font-family: Unbounded, sans-serif;
      margin-bottom: 10px;
    }
    h1 {
      text-align: center;
      font-family: Unbounded, sans-serif;
      font-size: clamp(22px, 5vw, 32px);
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .sub {
      text-align: center;
      color: var(--mute);
      font-size: 14px;
      margin-bottom: 22px;
    }
    h2 {
      font-family: Unbounded, sans-serif;
      font-size: 18px;
      margin: 8px 0 12px;
    }
    h2 span { color: var(--pink); }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .slider {
      position: relative;
      aspect-ratio: 3 / 4;
      background: #0a0507;
      overflow: hidden;
    }
    .slider img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .25s ease;
    }
    .slider img.active { opacity: 1; }
    .nav {
      position: absolute;
      top: 0; bottom: 0;
      width: 38%;
      z-index: 2;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .nav.prev { left: 0; }
    .nav.next { right: 0; }
    .dots {
      position: absolute;
      left: 0; right: 0; bottom: 8px;
      display: flex;
      justify-content: center;
      gap: 5px;
      z-index: 3;
    }
    .dots i {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
    }
    .dots i.on { background: #fff; }
    .meta { padding: 10px 10px 12px; }
    .city {
      color: var(--pink2);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .name {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 10px;
    }
    .tg {
      display: block;
      text-align: center;
      text-decoration: none;
      color: #140208;
      background: linear-gradient(180deg, #ff8ab0, var(--pink));
      border-radius: 999px;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 800;
    }
    .tg:hover { filter: brightness(1.08); }
    footer {
      text-align: center;
      color: var(--mute);
      font-size: 12px;
      margin-top: 8px;
    }
    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 860px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .name { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Qyz Night</div>
    <h1>Эскорт Алматы и Астана — живые фото, 18+</h1>
    <p class="sub">Алматы · Астана · сразу в Telegram · 18+</p>

    <h2>Алматы <span>/</span> анкеты</h2>
    <div class="grid" id="almaty"></div>

    <h2>Астана <span>/</span> анкеты</h2>
    <div class="grid" id="astana"></div>

    <footer>18+ · Qyz Night</footer>
  </div>

  <script>
    const almaty = [
      ["Sexy Girls Almaty VIP", "https://t.me/SexyGirlsAlmatyVIP"],
      ["VIP Kyzdar Almaty", "https://t.me/VIPKyzdarAlmaty"],
      ["Almaty VIP Escort", "https://t.me/AlmatyVipEscort"],
      ["Hot Kyzdar Almaty", "https://t.me/HotKyzdarAlmaty"],
      ["Individualki Almaty", "https://t.me/Individualki_Almaty1"],
      ["Kizdar Almaty", "https://t.me/Kizdar_almaty12"],
      ["Kyzdar Escort Almaty", "https://t.me/kyzdarEscortAlmaty"],
      ["Best Kyzdar Almaty", "https://t.me/BestKyzdarAlmaty"],
      ["Pohotlivye Kyzdar", "https://t.me/PohotlivyeKyzdar"],
      ["Premium Kyzdar Almaty", "https://t.me/PremiumKyzdazAlmaty"],
      ["Razvratnye Kyzdar", "https://t.me/RazvratnyeKyzdar"],
      ["Elite Escort Almaty", "https://t.me/EliteEscortAlmaty"],
      ["Almatinsky VIP Kyzdar", "https://t.me/Almatinsky_VIP_Kyzdar"]
    ];

    const astana = [
      ["Pohotlivye Kyzdar Astana", "https://t.me/Pohotlivye_Kyzdar_Astana"],
      ["Prostitutki Astana", "https://t.me/Prostitutki_Astana3"],
      ["Lux Kyzdar Astana", "https://t.me/LuxKyzdarAstana"],
      ["Goryachiy Escort Astana", "https://t.me/GoryachiyEscortAstana"],
      ["VIP Kyzdar Astana", "https://t.me/VIP_Kyzdar_Astana"],
      ["Very Hot Kyzdar Astana", "https://t.me/VeryHotKyzdarAstana"],
      ["Best Kyzdar Astana", "https://t.me/Best_Kyzdar_Astana"],
      ["VIP Krasotki Astana", "https://t.me/VIP_Krasotki_Astana"],
      ["Elite Kyzdar Astana", "https://t.me/EliteKyzdarAstana"],
      ["Sochnye Krasotki Astana", "https://t.me/SochnyeKrasotkiAstana"],
      ["Lux Kyzdar Astana 2", "https://t.me/Lux_Kyzdar_Astana"],
      ["VIP Beauties Astana", "https://t.me/VIP_Beauties_Astana"],
      ["Hot Kyzdar Astana", "https://t.me/Hot_Kyzdar_Astana"],
      ["Kyzdar Astana Private", "https://t.me/KyzdarAstanaPrivate"],
      ["Kyzdar Astana NonStop", "https://t.me/KyzdarAstanaNonStop"]
    ];

    function card(city, name, url) {
      const slug = url.split("/").pop();
      const list = [1,2,3].map((n) => `img/${slug}_${n}.jpg`);
      const photos = list.map((src, i) =>
        `<img src="${src}" alt="${name}" class="${i === 0 ? "active" : ""}">`
      ).join("");
      const dots = list.map((_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("");
      return `<article class="card">
        <div class="slider">
          ${photos}
          <button class="nav prev" type="button" aria-label="prev"></button>
          <button class="nav next" type="button" aria-label="next"></button>
          <div class="dots">${dots}</div>
        </div>
        <div class="meta">
          <div class="city">${city}</div>
          <div class="name">${name}</div>
          <a class="tg" href="${url}" target="_blank" rel="noopener">Открыть Telegram</a>
        </div>
      </article>`;
    }

    function render(id, city, list) {
      document.getElementById(id).innerHTML = list.map(([n, u]) => card(city, n, u)).join("");
    }

    render("almaty", "Алматы", almaty);
    render("astana", "Астана", astana);

    document.querySelectorAll(".slider").forEach((slider) => {
      const imgs = [...slider.querySelectorAll("img")];
      const dots = [...slider.querySelectorAll(".dots i")];
      let i = 0;
      const show = (n) => {
        i = (n + imgs.length) % imgs.length;
        imgs.forEach((el, k) => el.classList.toggle("active", k === i));
        dots.forEach((el, k) => el.classList.toggle("on", k === i));
      };
      slider.querySelector(".prev").onclick = () => show(i - 1);
      slider.querySelector(".next").onclick = () => show(i + 1);
      setInterval(() => show(i + 1), 4500);
    });
  </script>
</body>
</html>
